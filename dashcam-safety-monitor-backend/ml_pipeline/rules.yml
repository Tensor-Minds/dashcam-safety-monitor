version: '2.0'
priority_policy: higher_number_wins
system:
  processing_target_fps: 10
  tracking_iou_threshold: 0.3
  duplicate_iou_threshold: 0.5
  visual_duration_ms: 2000
  maximum_track_misses: 2
  minimum_blur_score: 5
  minimum_mean_brightness: 5
  maximum_mean_brightness: 250
  image_quality_status_cooldown_ms: 10000
road_sign_filter:
  minimum_confidence: 0.15
  nms_iou_threshold: 0.45
  minimum_aspect_ratio: 0.2
  maximum_aspect_ratio: 2.5
  minimum_frame_area_ratio: 0.0001
  window_frames: 3
  minimum_hits: 1
pothole_filter:
  minimum_confidence: 0.15
  nms_iou_threshold: 0.4
  window_frames: 3
  minimum_hits: 1
anomaly_filter:
  minimum_confidence: 0.15
  nms_iou_threshold: 0.4
  window_frames: 3
  minimum_hits: 1
lane:
  minimum_confidence: 0.15
  ema_alpha: 0.7
  trigger_offset_ratio: 0.35
  clear_offset_ratio: 0.2
  minimum_duration_ms: 1500
rules:
- id: anomaly-accident
  enabled: true
  module: anomaly
  labels:
  - Accident
  minimum_confidence: 0.15
  severity: critical
  priority: 14
  temporal:
    window_frames: 3
    minimum_hits: 1
  visual_duration_ms: 2000
  cooldown_ms: 1000
  message: Warning. Possible road accident detected ahead. Slow down safely and keep
    your distance.
  audio_key: anomaly
  conditions: {}
- id: anomaly-car-fire
  enabled: true
  module: anomaly
  labels:
  - Car Fire
  minimum_confidence: 0.15
  severity: critical
  priority: 14
  temporal:
    window_frames: 3
    minimum_hits: 1
  visual_duration_ms: 2000
  cooldown_ms: 1000
  message: Warning. Possible vehicle fire detected ahead. Keep a safe distance.
  audio_key: anomaly
  conditions: {}
- id: anomaly-fighting
  enabled: true
  module: anomaly
  labels:
  - Fighting
  minimum_confidence: 0.15
  severity: critical
  priority: 14
  temporal:
    window_frames: 3
    minimum_hits: 1
  visual_duration_ms: 2000
  cooldown_ms: 1000
  message: Possible dangerous incident detected ahead. Proceed carefully.
  audio_key: anomaly
  conditions: {}
- id: anomaly-snatching
  enabled: true
  module: anomaly
  labels:
  - Snatching
  minimum_confidence: 0.15
  severity: critical
  priority: 14
  temporal:
    window_frames: 3
    minimum_hits: 1
  visual_duration_ms: 2000
  cooldown_ms: 1000
  message: Possible dangerous incident detected ahead. Proceed carefully.
  audio_key: anomaly
  conditions: {}
- id: lane-departure
  enabled: true
  module: lane_line
  labels:
  - Lane Departure
  minimum_confidence: 0.5
  severity: critical
  priority: 13
  temporal:
    minimum_duration_ms: 1500
  visual_duration_ms: 2000
  cooldown_ms: 1500
  message: Lane departure warning. Drifting {direction}. Return to your lane when
    safe.
  audio_key: lane_departure
  conditions:
    matching_turn_signal_suppresses: true
    unknown_turn_signal_suppresses: true
- id: lane-pedestrian-crossing
  enabled: true
  module: lane_line
  labels:
  - Crossing
  - Crosswalk
  - Pedestrian Crossing
  - Pedestrian-Crossing
  minimum_confidence: 0.15
  severity: warning
  priority: 8
  temporal:
    window_frames: 3
    minimum_hits: 2
  visual_duration_ms: 2000
  cooldown_ms: 1500
  message: Warning. Pedestrian crossing detected ahead. Slow down and be prepared
    to stop.
  audio_key: road_sign
  conditions: {}
- id: pothole-detected
  enabled: true
  module: pothole
  labels:
  - Pothole
  minimum_confidence: 0.15
  severity: critical
  priority: 13
  temporal:
    window_frames: 3
    minimum_hits: 2
  visual_duration_ms: 2000
  cooldown_ms: 1000
  message: Warning. Possible pothole ahead. Reduce speed safely.
  audio_key: pothole
  conditions: {}
- id: alligator-crack-detected
  enabled: true
  module: pothole
  labels:
