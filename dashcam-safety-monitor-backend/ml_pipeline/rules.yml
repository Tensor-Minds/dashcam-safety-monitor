  labels:
  - Speed Limit
  minimum_confidence: 0.6
  severity: warning
  priority: 9
  temporal:
    window_frames: 5
    minimum_hits: 3
    minimum_duration_ms: 1500
  visual_duration_ms: 2000
  cooldown_ms: 1500
