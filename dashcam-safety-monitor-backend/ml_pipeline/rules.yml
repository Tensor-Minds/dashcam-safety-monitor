  minimum_confidence: 0.15
  severity: warning
  priority: 11
  temporal:
    window_frames: 3
    minimum_hits: 2
  visual_duration_ms: 2000
  cooldown_ms: 1000
  message: Warning. Road-surface damage detected ahead. Proceed carefully.
