name: dashcam-safety-monitor

services:
  backend:
    build:
      context: ./dashcam-safety-monitor-backend
      dockerfile: Dockerfile
    env_file:
      - path: ./dashcam-safety-monitor-backend/.env
        required: false
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_videos:/app/static/videos
    restart: unless-stopped

  frontend:
    build:
      context: ./dashcam-safety-monitor-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  backend_videos:
